<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Simon Shu, co-founder and CEO of Restart</title>
  <desc id="desc">Restart is building autonomous intelligence infrastructure for companies: company-specific capabilities for the agents and models a company already uses.</desc>

  <rect width="1200" height="330" fill="#F3F0E8"/>

  <!-- frame rules -->
  <g stroke="#14130F" stroke-width="1" fill="none">
    <line x1="64" y1="40.5" x2="1136" y2="40.5"/>
    <line x1="64" y1="289.5" x2="1136" y2="289.5"/>
    <line x1="64.5" y1="34" x2="64.5" y2="47"/>
    <line x1="1135.5" y1="34" x2="1135.5" y2="47"/>
    <line x1="64.5" y1="283" x2="64.5" y2="296"/>
    <line x1="1135.5" y1="283" x2="1135.5" y2="296"/>
  </g>

  <!-- kicker -->
  <rect x="64" y="72" width="28" height="4" fill="#A7B82A"/>
  <text x="104" y="79" fill="#14130F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="2.2">SIMON SHU  /  CO-FOUNDER &amp; CEO, RESTART</text>

  <!-- headline -->
  <g fill="#14130F" font-family="ui-serif, 'Iowan Old Style', 'Palatino Linotype', Georgia, 'Times New Roman', serif" font-size="62" letter-spacing="-0.6">
    <text x="61" y="152">Autonomous intelligence</text>
    <text x="61" y="222">infrastructure for companies.</text>
  </g>

  <!-- dek -->
  <text x="64" y="261" fill="#55524A" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19">Company-specific capabilities for the agents and models companies already use.</text>

  <!-- footer -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="1.6" fill="#55524A">
    <text x="64" y="315">RESTART.NEW</text>
    <text x="1136" y="315" text-anchor="end">SAN FRANCISCO</text>
  </g>

  <!-- schematic: company systems, capability layer, agents -->
  <g fill="none" stroke="#14130F" stroke-width="1">
    <!-- company side -->
    <path d="M 926 112 H 966 V 166 H 1000"/>
    <path d="M 926 166 H 1000"/>
    <path d="M 926 220 H 966 V 166"/>
    <!-- agent side -->
    <path d="M 1028 166 H 1062 V 112 H 1098"/>
    <path d="M 1028 166 H 1098"/>
    <path d="M 1062 166 V 220 H 1098"/>
    <!-- capability ring -->
    <circle cx="1014" cy="166" r="22" stroke-dasharray="2 4"/>
  </g>
  <g fill="#F3F0E8" stroke="#14130F" stroke-width="1.2">
    <rect x="910" y="104" width="16" height="16"/>
    <rect x="910" y="158" width="16" height="16"/>
    <rect x="910" y="212" width="16" height="16"/>
    <circle cx="1106" cy="112" r="8"/>
    <circle cx="1106" cy="166" r="8"/>
    <circle cx="1106" cy="220" r="8"/>
  </g>
  <circle cx="1014" cy="166" r="11" fill="#A7B82A" stroke="#14130F" stroke-width="1.2"/>
  <g fill="#55524A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.4">
    <text x="918" y="79" text-anchor="middle">COMPANY</text>
    <text x="1106" y="79" text-anchor="middle">AGENTS</text>
    <text x="1014" y="258" text-anchor="middle">MCP + PLUGIN</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Simon Shu</title>
  <desc id="desc">Systems, agents, and experiments. San Francisco.</desc>

  <rect width="1200" height="280" fill="#12120F"/>

  <!-- frame rules -->
  <g stroke="#ECE8DD" stroke-width="1" fill="none">
    <line x1="64" y1="40.5" x2="1136" y2="40.5"/>
    <line x1="64" y1="239.5" x2="1136" y2="239.5"/>
    <line x1="64.5" y1="34" x2="64.5" y2="47"/>
    <line x1="1135.5" y1="34" x2="1135.5" y2="47"/>
    <line x1="64.5" y1="233" x2="64.5" y2="246"/>
    <line x1="1135.5" y1="233" x2="1135.5" y2="246"/>
  </g>

  <!-- handle -->
  <rect x="64" y="70" width="28" height="4" fill="#C2D040"/>
  <text x="104" y="77" fill="#A29D90" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="2">@simoicy99</text>

  <!-- name -->
  <text x="60" y="162" fill="#ECE8DD" font-family="ui-serif, 'Iowan Old Style', 'Palatino Linotype', Georgia, 'Times New Roman', serif" font-size="88" letter-spacing="-1">Simon Shu</text>

  <!-- line -->
  <text x="64" y="204" fill="#A29D90" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="0.6">Systems, agents, and experiments.</text>

  <!-- location -->
  <text x="1136" y="265" text-anchor="end" fill="#A29D90" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="1.6">SAN FRANCISCO</text>

  <!-- connection motif -->
  <g fill="none" stroke="#ECE8DD" stroke-width="1">
    <path d="M 926 92 H 966 V 140 H 1000"/>
    <path d="M 926 140 H 1000"/>
    <path d="M 926 188 H 966 V 140"/>
    <path d="M 1028 140 H 1062 V 92 H 1098"/>
    <path d="M 1028 140 H 1098"/>
    <path d="M 1062 140 V 188 H 1098"/>

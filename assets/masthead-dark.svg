    <rect x="910" y="132" width="16" height="16"/>
    <rect x="910" y="180" width="16" height="16"/>
    <circle cx="1106" cy="92" r="8"/>
    <circle cx="1106" cy="140" r="8"/>
    <circle cx="1106" cy="188" r="8"/>
